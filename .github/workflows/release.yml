# Modified for LAN Party Hub; see CHANGES.md and NOTICE.md.
name: Portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"

jobs:
  windows-portable:
    name: Build Windows portable package
    permissions:
      contents: read
    uses: ./.github/workflows/windows-artifact.yml

  publish-release:
    name: Publish GitHub release
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: LAN-Party-Hub-windows-x64
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/LAN-Party-Hub-windows-x64.zip
            artifacts/LAN-Party-Hub-windows-x64.zip.sha256
